name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency: release

jobs:
  release:
    # The template repository itself is never released.
    if: github.repository != 'kanagawa-community/template'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: cocogitto/cocogitto-action@52d0023b4396897f1815648e553db2ab8d782f3a # v4.2.0
        with:
          install-only: true

      - name: Tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          next="$(cog bump --auto --dry-run 2>/dev/null | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+' | head -n1 || true)"
          if [ -z "$next" ]; then
            echo "No commits since the last tag require a new version."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cog bump --auto
          git push origin "refs/tags/$next"
          gh release create "$next" --title "$next" --notes "$(cog changelog --at "$next")"
