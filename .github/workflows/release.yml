name: Release

# Releases are prepared by a maintainer with scripts/release.sh in the
# organization .github repository, which opens a pull request that updates
# CHANGELOG.md. Merging it publishes the release here.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency: release

jobs:
  release:
    # The template repository itself is never released.
    if: github.repository != 'kanagawa-community/template'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # Only the merge commit of a release pull request publishes a release.
          subject="$(printf '%s\n' "$MESSAGE" | head -n1)"
          pattern='^chore\(release\): ([0-9]+\.[0-9]+\.[0-9]+)( \(#[0-9]+\))?$'
          if [[ ! "$subject" =~ $pattern ]]; then
            echo "Not a release commit, so there is nothing to publish."
            exit 0
          fi
          version="${BASH_REMATCH[1]}"

          # A re-run after a release finds the tag already in place.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$version" >/dev/null 2>&1; then
            echo "$version is already released."
            exit 0
          fi

          # The release notes are this version's section of CHANGELOG.md.
          notes="$(awk -v v="$version" '/^## /{ if (found) exit; if (index($0, "[" v "]")) found=1 } found' CHANGELOG.md | tail -n +2)"
          if [ -z "$notes" ]; then
            echo "CHANGELOG.md has no section for $version."
            exit 1
          fi

          # Creating the release also creates the tag, on the merge commit.
          gh release create "$version" --target "$GITHUB_SHA" --title "$version" --notes "$notes"
